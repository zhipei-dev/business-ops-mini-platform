<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operations Dashboard</title><link rel="stylesheet" th:href="@{/app.css}"></head><body>
<header><h1>Operations Dashboard</h1><p>Synthetic demo only · purchase to receipt to inventory to sale</p></header>
<main>
<section><h2>Products</h2><form id="product-form"><input name="sku" placeholder="SKU" required maxlength="80"><input name="name" placeholder="Product name" required maxlength="160"><input name="unitPrice" type="number" min="0" step=".01" placeholder="Unit price" required><button>Create product</button></form><table><thead><tr><th>SKU</th><th>Name</th><th>Price</th></tr></thead><tbody id="products"></tbody></table></section>
<section><h2>Purchase orders</h2><form id="purchase-form"><input name="party" placeholder="Supplier" required><select name="productId" class="product-select" required></select><input name="quantity" type="number" min="1" placeholder="Qty" required><input name="unitPrice" type="number" min="0" step=".01" placeholder="Price" required><button>Create PO</button></form><table><thead><tr><th>ID</th><th>Supplier</th><th>Status</th><th>Qty</th><th>Actions</th></tr></thead><tbody id="purchases"></tbody></table></section>
<section><h2>Sales orders</h2><form id="sales-form"><input name="party" placeholder="Customer" required><select name="productId" class="product-select" required></select><input name="quantity" type="number" min="1" placeholder="Qty" required><input name="unitPrice" type="number" min="0" step=".01" placeholder="Price" required><button>Create sale</button></form><table><thead><tr><th>ID</th><th>Customer</th><th>Status</th><th>Qty</th><th>Actions</th></tr></thead><tbody id="sales"></tbody></table></section>
<section><h2>Inventory ledger balance</h2><table><thead><tr><th>SKU</th><th>Product</th><th>On hand</th></tr></thead><tbody id="inventory"></tbody></table></section>
<section><h2>Audit timeline</h2><ol id="audit"></ol></section><p id="message" role="status"></p>
</main><script th:src="@{/app.js}"></script></body></html>
